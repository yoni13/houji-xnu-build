name: houji iOS 27 kernel
# Builds the source (native) XNU of the iOS 27 port with Xcode and uploads it with its symbol-bearing reference build.
# The prelink against the original kernelcache runs on the owner's machine: no Apple kext is built into anything uploaded here.
on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Commit or branch of yoni13/UniXNU-houji (the iOS 27 device repository)
        type: string
        default: ios27
      unixnu_ref:
        description: Commit of UniXNU/UniXNU
        type: string
        default: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
      xcode:
        description: Xcode version of the macos-26 image
        type: string
        default: '26.6'
      defconfig:
        type: string
        default: houji_ios27_defconfig
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: yoni13/UniXNU-houji
          ref: ${{ inputs.device_ref }}
          path: device
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools
        run: |
          ls -d /Applications/Xcode_*.app
          brew install llvm lld mtools dtc ccache
          command -v unifdef || { brew install unifdef; echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; }
          xcodebuild -version
      - name: Configure
        run: |
          bash device/scripts/install-os-profile.sh "$PWD"
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$PWD/device"
          ./unixnu fetch
          ./unixnu status --json | head -40
      # Two caches. The compiler cache goes through XNU's own hook (make CCACHE=ccache; KCC = $(CCACHE) $(CC)) and serves both
      # the DEVELOPMENT build and the RELEASE reference build, whose private source copy has a different path each time its
      # inputs change (hence the base directory and no working directory in the hash). The reference kernel itself is kept
      # too: its builder reuses it when its recorded inputs and digest still match, which skips the LTO link.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ios27-ccache-v1-${{ github.run_id }}
          restore-keys: ios27-ccache-v1-
      - name: Restore reference kernel
        uses: actions/cache/restore@v4
        with:
          path: |
            out/houji/*/*/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            out/houji/*/*/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.json
          key: ios27-reference-v1-${{ github.run_id }}
          restore-keys: ios27-reference-v1-
      - name: Build the native kernel
        run: |
          # ccache refuses commands with -MJ (clang's compile-command record), and UniXNU's build passes it on every compile:
          # the board package builders replay those records. This wrapper writes the record itself and gives ccache the
          # command without the flag.
          cat > "$RUNNER_TEMP/ccwrap" <<'PY'
          #!/usr/bin/env python3
          import json, os, subprocess, sys
          args = sys.argv[1:]
          record = None
          if '-MJ' in args:
              at = args.index('-MJ'); record = args[at + 1]; del args[at:at + 2]
          status = subprocess.call(['ccache', *args])
          if record and status == 0:
              takes_value = {'-o', '-MF', '-MT', '-MQ', '-include', '-isysroot', '-arch', '-target', '-x', '-Xclang', '-I', '-D', '-iquote', '-isystem'}
              source = output = None
              for i, a in enumerate(args[1:], 1):
                  if a == '-o' and i + 1 < len(args): output = args[i + 1]
                  if not a.startswith('-') and args[i - 1] not in takes_value and a.rsplit('.', 1)[-1] in ('c', 'cpp', 'cc', 'cp', 's', 'S', 'm', 'mm'):
                      source = a
              with open(record, 'w') as f:
                  f.write(json.dumps({'directory': os.getcwd(), 'file': source, 'output': output, 'arguments': args}) + ',\n')
          sys.exit(status)
          PY
          chmod +x "$RUNNER_TEMP/ccwrap"
          export CCACHE="$RUNNER_TEMP/ccwrap" CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=3G CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=1
          export CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime
          ccache -z
          status=0
          ./unixnu build kernel --skip-prelink || status=$?
          ccache -s -vv | head -70
          grep -h 'reference inputs and digest match\|RELEASE reference exit' out/houji/*/*/logs/*reference*.log || true
          misses=$(ccache --print-stats | awk '$1=="local_storage_miss"{print $2}')
          [ "${misses:-1}" -ge 20 ] && echo "CCACHE_SAVE=1" >> "$GITHUB_ENV"
          exit $status
      - name: Save compiler cache
        if: always() && env.CCACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ios27-ccache-v1-${{ github.run_id }}
      - name: Save reference kernel
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            out/houji/*/*/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf
            out/houji/*/*/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.json
          key: ios27-reference-v1-${{ github.run_id }}
      - name: Collect
        if: always()
        run: |
          O=$(./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          mkdir -p "$RUNNER_TEMP/up"
          cd "$O"
          find . -maxdepth 2 -not -path './tree/*' | head -50
          ls -la tree/build/xnu/ios-obj/*/ tree/build/xnu/fileset-reference 2>/dev/null | head -60 || true
          tar -czf "$RUNNER_TEMP/up/logs.tgz" logs 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/up/native.tgz" kernel $(ls -d tree/build/xnu/ios-obj/*/mach.*.unstripped* tree/build/xnu/fileset-reference tree/build/*.json tree/build/xnu/*.json 2>/dev/null) || true
          ls -la "$RUNNER_TEMP/up"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houji-ios27-native
          path: ${{ runner.temp }}/up/*
          retention-days: 14
