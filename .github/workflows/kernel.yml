name: houji kernel
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image
        type: choice
        default: macos-15
        options: [macos-14, macos-15, macos-26]
      xcode:
        description: Xcode version (empty = runner default)
        type: string
        default: ''
      source_ref:
        description: Branch or commit of yoni13/UniXNU-houji (the kernel sources)
        type: string
        default: main
permissions:
  contents: read
env:
  XNU_REV: 1b191cb58250d0705d8a51287127505aa4bc0789
  DXB_REV: 663906528d1cd5ea8fde7de6f16de73db9511549
  ATH12K_WIFI_REV: f6bf561f92cc42761bdd417fce1d53fe1db9477c
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  ARCH_CONFIG: ARM64
  MACHINE_CONFIG: SWEET
jobs:
  kernel:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # Kernel sources: the public fork. This repository adds only private inputs (firmware headers, this phone's GPT and log
      # trial bindings).
      - uses: actions/checkout@v4
        with:
          repository: yoni13/UniXNU-houji
          ref: ${{ inputs.source_ref }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode and tools
        run: |
          brew install jq gum cmake ninja bash || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          if [ -n "${{ inputs.xcode }}" ]; then sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"; fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          ls -d /Applications/Xcode*.app
      - name: Prepare pinned XNU with houji patches and overlay
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build "$DXB_REV"
          git -C dxb checkout -q FETCH_HEAD
          git init -q xnu-upstream
          git -C xnu-upstream fetch -q --depth 1 https://github.com/apple-oss-distributions/xnu.git "$XNU_REV"
          git -C xnu-upstream checkout -q FETCH_HEAD
          python3 src/tools/prepare-sources.py kernel --upstream xnu-upstream --output dxb/xnu
          git -C src log -1 --format='kernel sources: yoni13/UniXNU-houji %H %s'
          # this phone's log file allocation and GPU handoff identity, and its GPT
          cp private/HoujiLogAllocation.h private/HoujiZapTrial.h dxb/xnu/iokit/Kernel/houji-ufs-root/
          python3 retarget-layout.py dxb/xnu
          # dxb applies its generic patches with `git apply`; give the tree a repository.
          git -C dxb/xnu init -q && git -C dxb/xnu add -A >/dev/null && git -C dxb/xnu -c user.email=ci@local -c user.name=ci commit -qm houji
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FW_KEY -in fwheaders.tar.gz.enc | tar -xzf - -C dxb/xnu/iokit/Kernel/houji-ufs-root/
          ls -la dxb/xnu/iokit/Kernel/houji-ufs-root/Houji*Firmware*.h
          # prebuilt objects (the Wi-Fi module) join the iokit component's link list
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dxb/xnu/iokit/conf/Makefile.template'); s = p.read_text()
          old = '\tdone > $(COMPONENT).filelist\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '\t$(_v)for obj in $(HOUJI_EXTRA_OBJS); do $(ECHO) $${obj}; done >> $(COMPONENT).filelist\n'))
          PY
          grep -n kHoujiRootFirst dxb/xnu/iokit/Kernel/houji-ufs-root/HoujiRootPolicy.h
        env:
          FW_KEY: ${{ secrets.FW_KEY }}
      # The Apple build dependencies (tools and headers in dxb/fakeroot) and the KDK image depend only on the pinned dxb revision, the
      # runner and Xcode: restored from the cache, only the KDK is installed again.
      - name: Restore Apple build dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            dxb/fakeroot
            kdk-cache
          key: dxb-deps-v1-${{ inputs.runner }}-xcode${{ inputs.xcode }}-${{ env.DXB_REV }}-${{ env.XNU_REV }}-${{ env.MACOS_VERSION }}
      - name: Install the cached KDK
        if: steps.deps.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse kdk-cache/KDK.dmg
          sudo mkdir -p /Library/Developer/KDKs
          sudo installer -pkg '/Volumes/Kernel Debug Kit/KernelDebugKit.pkg' -target /
          hdiutil detach '/Volumes/Kernel Debug Kit'
          ls -d /Library/Developer/KDKs/*
          touch deps-build.log
      - name: Build Apple build dependencies (dxb, without its XNU step)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: dxb
        run: |
          set -o pipefail
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('build.sh'); s = p.read_text()
          old = '        build_xnu\n        echo "  🎉 XNU Build Done!"'
          assert old in s
          s = s.replace(old, '        echo "dependencies ready"')
          # SWEET is plain arm64 (no PAC); libfirehose_kernel must carry an arm64 slice.
          arch = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          assert s.count(arch) == 1
          p.write_text(s.replace(arch, 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'))
          EOF
          bash build.sh 2>&1 | tee ../deps-build.log
          ls fakeroot/usr/local/bin fakeroot/usr/local/lib/kernel
          ls -d /Library/Developer/KDKs/*
          mkdir -p ../kdk-cache && cp /tmp/KDK.dmg ../kdk-cache/KDK.dmg
      - name: Restore Wi-Fi module sources
        uses: actions/cache@v4
        with:
          path: ath12k-wifi/deps
          key: ath12k-deps-v1-${{ env.ATH12K_WIFI_REV }}
      - name: Build Wi-Fi module (UniXNU Ath12kWifi)
        run: |
          set -euo pipefail
          brew --prefix llvm >/dev/null 2>&1 || brew install llvm
          git init -q ath12k-wifi
          git -C ath12k-wifi fetch -q --depth 1 https://github.com/UniXNU/Ath12kWifi.git "$ATH12K_WIFI_REV"
          git -C ath12k-wifi checkout -q FETCH_HEAD
          python3 src/tools/build-ath12k.py ath12k-wifi out/ath12k | tee ath12k-build.log
          test -f out/ath12k/houji_ath12k.o
          echo "HOUJI_EXTRA_OBJS=$PWD/out/ath12k/houji_ath12k.o" >> "$GITHUB_ENV"
      - name: Build houji kernel
        run: |
          set -o pipefail
          export HOUJI_XNU="$PWD/dxb/xnu"
          export HOUJI_KDK="$(ls -d /Library/Developer/KDKs/KDK_13.5_*.kdk | head -1)"
          export HOUJI_FAKEROOT="$PWD/dxb/fakeroot"
          export HOUJI_BUILD_ROOT="$PWD/out/kernel"
          export HOUJI_JOBS="$(sysctl -n hw.ncpu)"
          # The kernel build writes into DSTROOT=$HOUJI_BUILD_ROOT/fakeroot, but headers and
          # libfirehose_kernel come from FAKEROOT_DIR, which is the dxb fakeroot.
          bash src/tools/build-kernel.sh 2>&1 | tee kernel-build.log
      - name: Collect kernel
        if: always()
        run: |
          mkdir -p artifact
          find out/kernel -name 'kernel.development.sweet*' -not -path '*.dSYM/*' -print
          k=out/kernel/fakeroot/System/Library/Kernels/kernel.development.sweet
          [ -f "$k" ] || k=out/kernel/xnu.obj/DEVELOPMENT_ARM64_SWEET/kernel.development.sweet
          if [ -f "$k" ]; then cp "$k" artifact/kernel.development.sweet; file artifact/kernel.development.sweet; shasum -a 256 artifact/kernel.development.sweet > artifact/SHA256SUMS; fi
          cp deps-build.log kernel-build.log ath12k-build.log artifact/ 2>/dev/null || true
          tail -c 200000 kernel-build.log > artifact/kernel-build-tail.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houji-kernel
          path: artifact/
          retention-days: 7
